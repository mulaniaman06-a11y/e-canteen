<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-Canteen Login</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: white;
      font-family: Arial, sans-serif;
    }

    .login-container {
      width: 450px;
      padding: 60px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
      text-align: center;
    }

    .logo {
      width: 120px;
      margin-bottom: 15px;
    }

    h2 {
      margin-bottom: 20px;
      color: #003366;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 95%;
      padding: 12px;
      background-color: #003366;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0055aa;
    }

    .bg-logo {
      position: fixed;
      width: 400px;
      opacity: 0.08;
      z-index: -1;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

    <h2>E-Canteen Login</h2>

    <input 
      type="text" 
      id="enrollment" 
      placeholder="Enter Enrollment Number"
      maxlength="13"
      required
    >

    <input 
      type="password" 
      id="password" 
      placeholder="Enter Password" 
      required
    >

    <button onclick="login()">Login</button>

    <div class="message" id="message"></div>
  </div>

  <script>
    function login() {

      let enrollment = document.getElementById("enrollment").value;
      let password = document.getElementById("password").value;

      // Default password
      let defaultPassword = "123456";

      // Validation for enrollment number
      if(enrollment.length > 13 || enrollment.length < 12) {
        document.getElementById("message").innerHTML = "Invalid Enrollment Number ❌";
        document.getElementById("message").style.color = "red";
      }

      else if(password === defaultPassword) {
        document.getElementById("message").innerHTML = "Login Successful ✅";
        document.getElementById("message").style.color = "green";
      }

      else {
        document.getElementById("message").innerHTML = "Incorrect Password ❌";
        document.getElementById("message").style.color = "red";
      }
    }
  </script>
